name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# The job only reads the repository; it never writes to it or to any other
# GitHub resource, so the default token gets the minimum scope.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run lint
      - run: npm run typecheck
      - run: npm test

      # The storefront fetches data at request time, so the build needs no real
      # backend. A placeholder API URL keeps any build-time fetch from erroring;
      # the data functions fall back to empty results regardless.
      - run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: 1
          NEXT_PUBLIC_API_URL: https://example.com/api
